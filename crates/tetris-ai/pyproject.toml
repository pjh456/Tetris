[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "tetris-ai"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
    "stable-baselines3>=2.0",
    "tensorboard>=2.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
