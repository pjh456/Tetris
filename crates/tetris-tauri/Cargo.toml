[package]
name = "tetris-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "tetris_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tetris-net = { path = "../tetris-net" }
