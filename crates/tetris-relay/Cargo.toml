[package]
name = "tetris-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
tetris-net = { path = "../tetris-net" }
tetris-core = { path = "../tetris-core" }
tetris-protocol = { path = "../tetris-protocol" }
tetris-sim = { path = "../tetris-sim" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
bincode = "1.3"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
tokio-util = "0.7"
futures-util = "0.3"

[lints]
workspace = true
