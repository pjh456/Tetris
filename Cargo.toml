[workspace]
members = [
    "crates/tetris-core",
    "crates/tetris-net",
    "crates/tetris-cli",
    "crates/tetris-wasm",
    "crates/tetris-ai",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
rstest = "0.26"
proptest = "1.11"
criterion = { version = "0.5", features = ["html_reports"] }
