[workspace]
members = [
    "crates/tetris-core",
    "crates/tetris-net",
    "crates/tetris-cli",
    "crates/tetris-wasm",
    "crates/tetris-ai",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
rstest = "0.26"
proptest = "1.11"
criterion = { version = "0.5", features = ["html_reports"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
